# ─── Nginx Configuration: AI Video Factory ───────────────────────
# Place at: /etc/nginx/sites-available/ai-video-factory
# Enable:   ln -s /etc/nginx/sites-available/ai-video-factory /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # ─── Frontend (React build) ──────────────────────────────────
    root /var/www/ai-video-factory/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API Proxy (with Rate Limiting) ─────────────────────────
    # Note: Define 'limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;' inside nginx.conf http block.
    location /api/ {
        limit_req          zone=api_limit burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large timeout for file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Upload size limit (500MB)
        client_max_body_size 500M;
    }

    # ─── Socket.io Proxy ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;   # WebSocket connections stay open
    }

    # ─── Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # ─── Security headers ────────────────────────────────────────
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
}
